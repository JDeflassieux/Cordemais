<style>

.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.box{border:1px solid var(--line);background:var(--bg3);border-radius:12px;padding:12px 14px;font-size:.9rem}.box b{display:block;color:var(--teal);margin-bottom:4px;text-transform:uppercase;letter-spacing:.08em;font-size:.72rem}

.navLogo{display:flex;align-items:center;margin-right:6px}.navLogo img{height:34px;width:auto;filter:drop-shadow(0 2px 6px #0008)}@media(max-width:760px){.navLogo img{height:28px}}.headLogo{height:84px;width:auto;flex:none;filter:drop-shadow(0 4px 12px #0008)}@media print{.headLogo{height:22mm}}.ed{display:inline-block;min-width:60px;border-bottom:1px dashed #19a39b88;padding:0 3px;outline:none}.ed:focus{background:#0c2130;border-bottom-color:#ffd166}@media print{.ed{border:0!important;background:transparent!important}.missing{display:none}}</style></head><body>
<nav><a href="index.html" class="navLogo" aria-label="Escapades Atlantique"><img src="logo-escapade-embleme.png" alt=""></a><a href="index.html">← Escapades Atlantique</a><div class="tools"><button class="btn" onclick="window.print()">🖨 Imprimer / Enregistrer en PDF</button><a class="btn ghost" id="backLink" href="dehler.html#dates">Retour à ma réservation</a></div></nav>
<div class="sheet" id="sheet"><p class="noprint" style="font-size:.85rem;margin:0 0 10px">Ce contrat est généré à partir de votre réservation. Imprimez-le ou enregistrez-le en PDF (bouton en haut), signez-le et remettez-le signé au plus tard à la remise des clés.</p><div id="body"></div></div>
<script>(()=>{
const P=window.PARAMS,q=new URLSearchParams(location.search),key=q.get('key')||'maitika-bookings-v1',id=q.get('id');
const D=864e5,parse=s=>{const [y,m,d]=s.split('-').map(Number);return Math.floor(Date.UTC(y,m-1,d)/D)},fmtL=n=>new Date(n*D).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}),fmt=n=>new Date(n*D).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
const eur=v=>Math.round(v).toLocaleString('fr-FR')+' €';const isM=key.startsWith('maitika');
const BOAT=isM?{name:'Maïtika',model:'Dehler Optima 98 AK (1979)',len:'9,80 m × 3,00 m · tirant d’eau 1,60 m',motor:'Volvo Penta MD11C 23 ch, saildrive',cap:'9 personnes',page:'dehler.html'}:{name:'Petit Bonheur',model:'Voilier de 8 m (caractéristiques à compléter)',len:'8 m',motor:'à compléter',cap:'à compléter',page:'petit-bonheur.html'};
document.getElementById('backLink').href=BOAT.page+'#dates';
let L=[];try{L=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}let r=id?L.find(x=>x[4]===id):null;if(!r){let mine=[];try{const C=String(localStorage.getItem('sim-client')||'1');mine=L.filter(x=>String(x[5])===C&&x[3]==='paid')}catch(e){}r=mine[mine.length-1]}
const B=document.getElementById('body');
if(!r){B.innerHTML='<h2>Aucune réservation confirmée trouvée</h2><p>Le contrat se génère pour un séjour dont l’acompte a été payé. Revenez au calendrier, validez vos dates et réglez l’acompte.</p>';return}
let cl=r[7]||{};if(!cl.name){try{const A=JSON.parse(localStorage.getItem('audit-log')||'[]').filter(e=>e.kind==='paid'&&e.data&&e.data.id===r[4]).pop();if(A)cl={name:A.data.name||'',email:A.data.email||'',phone:'',exp:'',paidAt:A.t.slice(0,10)}}catch(e){}}
let ED={};try{ED=JSON.parse(localStorage.getItem('contract-edits-'+r[4])||'{}')}catch(e){}
const a=parse(r[0]),b=parse(r[1]),total=r[2]||0,sn=r[6]||{},days=b-a+1,dep=Math.round(total*0.30),solde=total-dep;
const free=a-P.CANCEL_FREE_DAYS,late=a-P.CANCEL_LATE_DAYS,ref=(BOAT.name.slice(0,2).toUpperCase())+'-'+r[0].replace(/-/g,'')+'-'+String(r[4]||'').slice(-4).toUpperCase();
const miss=(v,lbl)=>v?v:'<span class="missing">'+lbl+'</span>';
B.innerHTML=`
<div class="head"><div style="display:flex;gap:16px;align-items:center"><img class="headLogo" src="logo-escapade-embleme.png" alt="Escapades Atlantique"><div><div class="brand">Escapades Atlantique · Pornichet</div><div class="title">Contrat de location de voilier<br>sans skipper</div></div></div><div class="ref">Référence ${ref}<br>Établi le ${fmt(Math.floor(Date.now()/D))}<br>Statut : ${r[3]==='paid'?'acompte reçu':'en attente de paiement'}</div></div>
<div class="two"><div class="box"><b>Le loueur</b><span class="ed" data-f="ownerName" contenteditable="true">${ED.ownerName||P.OWNER_NAME||''}</span>${(ED.ownerName||P.OWNER_NAME)?'':'<span class="missing"> ← nom du loueur à saisir ici ou dans les Réglages</span>'}<br><span class="ed" data-f="ownerAddr" contenteditable="true">${ED.ownerAddr||P.OWNER_ADDRESS||''}</span>${(ED.ownerAddr||P.OWNER_ADDRESS)?'':'<span class="missing"> ← adresse</span>'}<br>Bateau basé à Cordemais, mis à disposition au port de Pornichet.</div>
<div class="box"><b>Le locataire</b><span class="ed" data-f="name" contenteditable="true">${ED.name||cl.name||''}</span>${(ED.name||cl.name)?'':'<span class="missing"> ← nom du locataire à saisir ici</span>'}<br><span class="ed" data-f="email" contenteditable="true">${ED.email||cl.email||''}</span> · <span class="ed" data-f="phone" contenteditable="true">${ED.phone||cl.phone||''}</span><br>Expérience déclarée : <span class="ed" data-f="exp" contenteditable="true">${ED.exp||cl.exp||''}</span><br>Pièce d’identité et permis / attestation présentés à la remise des clés : ☐</div></div>
<p class="noprint" style="font-size:.82rem;margin:6px 0 0">✎ Les champs encadrés en pointillé se complètent directement ici (cliquez, tapez) ; vos saisies sont conservées pour ce contrat et n’apparaissent pas à l’impression comme des champs.</p>
<h2>1. Le bateau</h2><table><tr><th>Nom</th><td>${BOAT.name}</td></tr><tr><th>Modèle</th><td>${BOAT.model}</td></tr><tr><th>Dimensions</th><td>${BOAT.len}</td></tr><tr><th>Motorisation</th><td>${BOAT.motor}</td></tr><tr><th>Capacité</th><td>${BOAT.cap}</td></tr><tr><th>Inventaire et équipement de sécurité</th><td>Selon la fiche d’inventaire contradictoire signée à la remise des clés (annexe 1).</td></tr></table>
<h2>2. Dates, lieu et horaires</h2><table><tr><th>Remise des clés</th><td><b>${fmtL(a)}</b> à 17 h, port de Pornichet</td></tr><tr><th>Retour et état des lieux</th><td><b>${fmtL(b)}</b> à 16 h, port de Pornichet</td></tr><tr><th>Durée</th><td>${days} jours calendaires (premier jour compté ⅓, dernier jour ⅔)</td></tr><tr><th>Zone de navigation autorisée</th><td>${P.NAV_ZONE||'à préciser'}</td></tr></table>
<h2>3. Prix et paiement</h2><table>${sn.base?`<tr><th>Prix de base</th><td class="v">${eur(sn.base)}</td></tr>${(sn.items||[]).map(([n,v])=>`<tr><th>Remise · ${n}</th><td class="v">−${v} %</td></tr>`).join('')}`:''}<tr><th>Prix total de la location</th><td class="v">${eur(total)}</td></tr><tr><th>Acompte (30 %) à la réservation</th><td class="v">${eur(dep)}${cl.paidAt?' · reçu le '+cl.paidAt.split('-').reverse().join('/'):''}</td></tr><tr><th>Solde dû 30 jours avant le départ, au plus tard le ${fmt(a-30)}</th><td class="v">${eur(solde)}</td></tr><tr><th>Dépôt de garantie (caution) à la remise des clés</th><td class="v">${eur(P.GUARANTEE||0)}</td></tr></table>
<p class="small">Barème appliqué${sn.at?' au '+sn.at.split('-').reverse().join('/'):''} : hors saison ${eur(sn.lo||P.PRICE_M_LOW)} / jour, pleine saison ${eur(sn.hi||P.PRICE_M_HIGH)} / jour (juillet-août). Le prix comprend la place de port à Pornichet pendant la location ; il ne comprend ni le carburant consommé, ni les frais de port dans les autres escales.</p>
<h2>4. Annulation par le locataire</h2><div class="sched"><span class="g">✔ Sans frais jusqu’au ${fmt(free)}</span><span class="o">⚠ Du ${fmt(free+1)} au ${fmt(late-1)} : ${eur(total*P.CANCEL_MID_PCT/100)} retenus (${P.CANCEL_MID_PCT} %)</span><span class="r">⛔ À partir du ${fmt(late)} : ${eur(total*P.CANCEL_LATE_PCT/100)} (${P.CANCEL_LATE_PCT} %)</span></div>
<p class="art">L’annulation se fait depuis la page de réservation ou par écrit. Si le bateau a été convoyé à Pornichet pour cette seule location, le coût réel du convoyage est dû s’il dépasse les montants ci-dessus. Un report de dates sans frais est possible jusqu’à ${P.CANCEL_FREE_DAYS} jours avant le départ, dans la limite des disponibilités de la saison.</p>
<h2>5. Règlement de la location</h2><div class="art">
<p><b>Art. 1 · Compétence.</b> Le locataire déclare détenir les compétences nécessaires à la conduite d’un voilier de cette taille en navigation côtière et en justifie à la remise des clés (permis, attestation ou expérience vérifiable). Le loueur peut refuser la remise du bateau, sans remboursement, si cette compétence n’est manifestement pas établie.</p>
<p><b>Art. 2 · Zone et conditions.</b> La navigation est limitée à la zone définie à l’article 2 du présent contrat, de jour, et suspendue dès que la météo prévue dépasse force 6 ou que la visibilité est insuffisante. Toute navigation de nuit ou hors zone est interdite sans accord écrit du loueur.</p>
<p><b>Art. 3 · Remise des clés et état des lieux.</b> Un inventaire et un état des lieux contradictoires sont établis à la remise des clés et au retour, avec photographies. Le bateau est remis propre, réservoir de carburant plein, et restitué dans le même état. Le carburant manquant et le nettoyage sont facturés au locataire.</p>
<p><b>Art. 4 · Retour.</b> Le retour a lieu le dernier jour à 16 h au port de Pornichet. Tout retard non justifié par les conditions météo est facturé au prorata du prix journalier, majoré de 50 %. Le locataire prévient le loueur par téléphone de tout retard prévisible.</p>
<p><b>Art. 5 · Dépôt de garantie.</b> Un dépôt de garantie de ${eur(P.GUARANTEE||0)} est remis à la remise des clés (empreinte bancaire ou chèque). Il est restitué après l’état des lieux de retour, déduction faite des dommages, pertes, carburant et nettoyage constatés. Il couvre au maximum la franchise de l’assurance.</p>
<p><b>Art. 6 · Assurance.</b> Le bateau est assuré par le loueur en navigation de plaisance (corps et responsabilité civile), dont les conditions sont tenues à disposition du locataire. Restent à la charge du locataire : la franchise, les dommages résultant d’une faute grave ou d’un usage non conforme, les effets personnels, et les frais de remorquage ou d’assistance non couverts.</p>
<p><b>Art. 7 · Usage.</b> Le bateau est réservé à un usage de plaisance par le locataire et les personnes qu’il déclare, dans la limite de la capacité autorisée. Sont interdits la sous-location, le transport payant de passagers, les régates, le remorquage, et tout usage commercial. Les gilets sont portés par les enfants en permanence et par tous dans les conditions prévues par la réglementation.</p>
<p><b>Art. 8 · Avaries et incidents.</b> Le locataire signale immédiatement toute avarie, échouement ou incident au loueur et prend les mesures conservatoires nécessaires. Aucune réparation n’est engagée sans accord du loueur, sauf urgence. Le locataire reste responsable des dommages causés à des tiers.</p>
<p><b>Art. 9 · Indisponibilité du bateau.</b> Si le bateau ne peut être mis à disposition (avarie, convoyage empêché par la météo), le loueur propose un report ou rembourse intégralement les sommes versées, sans autre indemnité.</p>
<p><b>Art. 10 · Données et litiges.</b> Les coordonnées du locataire servent uniquement à l’exécution du contrat. Le présent contrat est soumis au droit français ; à défaut d’accord amiable, les tribunaux du lieu de mise à disposition sont compétents.</p></div>
<div class="warn"><b>Projet de contrat.</b> Les articles ci-dessus sont une base de travail à faire valider par l’assureur du bateau et, le cas échéant, par un conseil, notamment au regard du pavillon du bateau et du cadre de mise à disposition.</div>
<h2>6. Signatures</h2><p class="small" style="color:var(--tx)">Fait en deux exemplaires. Le locataire reconnaît avoir pris connaissance des conditions de location (${location.origin.startsWith('http')?location.origin+location.pathname.replace('contrat.html','conditions.html'):'conditions.html'}) et du présent règlement, et les accepter.</p>
<div class="sig"><div>Le loueur · ${ED.ownerName||P.OWNER_NAME||'…'}<span>Date et signature, précédées de « lu et approuvé »</span></div><div>Le locataire · ${ED.name||cl.name||'…'}<span>Date et signature, précédées de « lu et approuvé »</span></div></div>
<p class="small" style="font-size:.75rem;margin-top:14px">Annexe 1 : inventaire et état des lieux contradictoire (remise des clés / retour). Annexe 2 : conditions générales de location en vigueur à la date de réservation.</p>`;
document.querySelectorAll('.ed').forEach(el=>{el.addEventListener('input',()=>{ED[el.dataset.f]=el.textContent.trim();try{localStorage.setItem('contract-edits-'+r[4],JSON.stringify(ED))}catch(e){}const m=el.nextElementSibling;if(m&&m.classList.contains('missing')&&el.textContent.trim())m.remove();document.querySelectorAll('.sig div').forEach((d,i)=>{const lab=i===0?'Le loueur · ':'Le locataire · ';const v=i===0?(ED.ownerName||P.OWNER_NAME):(ED.name||cl.name);d.firstChild.textContent=lab+(v||'…')})})});
})();</script></body></html>
